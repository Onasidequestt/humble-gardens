<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Humble Gardens Office</title>
<style>
:root{--g:#2f5a3a;--gl:#e4efe6;--ink:#1b241d;--mute:#5a6157;--line:#d5dbd3;--bg:#fff;--warn:#fff4d6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.demo{background:var(--warn);border-bottom:1px solid #e6d49a;padding:10px 16px;font-size:15px;text-align:center}
.demo button{font:inherit;font-size:14px;margin-left:8px;padding:4px 10px;border:1px solid #b9a45c;background:#fff;border-radius:6px;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:12px 16px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.top a{color:var(--g);font-size:17px}
h1{font-size:30px;margin:10px 0 6px}h2{font-size:22px;margin:24px 0 10px}
a{color:var(--g)}
.big{display:block;width:100%;padding:22px;margin-top:18px;font:inherit;font-size:24px;background:var(--g);color:#fff;border:0;border-radius:12px;cursor:pointer;text-align:center;text-decoration:none}
.who{display:grid;gap:12px;margin-top:12px}
.who button{font:inherit;font-size:24px;padding:22px;border:2px solid var(--g);border-radius:12px;background:#fff;color:var(--ink);cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:center}
.who small{font-size:15px;color:var(--mute)}
.days{display:grid;gap:10px}
.day{display:flex;justify-content:space-between;align-items:center;padding:20px;font-size:22px;border:2px solid var(--g);border-radius:12px;color:#1d3a25;text-decoration:none;background:#fff}
.day small{font-size:16px;color:var(--mute);margin-left:6px}.day.done{background:var(--gl)}.day.today{border-width:4px}
.day.future{border-color:#ddd;color:#666;padding:12px 20px;font-size:18px}.day i{font-size:16px;color:var(--mute)}
.day .l{display:flex;flex-direction:column}.day .jobs{font-size:14px;color:var(--mute);margin:2px 0 0}.day small{font-size:17px;color:#3c463f}.day.future small{color:#666}
.saved{background:var(--gl);border:2px solid var(--g);border-radius:12px;padding:14px;font-size:20px}
.stick{position:fixed;left:0;right:0;bottom:0;background:var(--bg);padding:6px 16px 12px;box-shadow:0 -6px 16px rgba(0,0,0,.08)}.stick .big{margin-top:4px}.stick .big small{display:block;font-size:17px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.entry main{padding-bottom:150px}.err{color:#a33;font-size:19px;margin:6px 0;min-height:1em}
.sample{position:absolute;right:16px;top:12px;font-size:13px;letter-spacing:1px;color:#a07a1a;border:1px solid #d7b45a;background:var(--warn);padding:2px 8px;border-radius:6px}.inv{position:relative}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}.hrs{grid-template-columns:repeat(4,1fr)}
.pick{display:block;position:relative}.pick input{position:absolute;opacity:0}
.pick span{display:block;padding:20px 8px;text-align:center;font-size:20px;border:2px solid var(--g);border-radius:12px;cursor:pointer;background:#fff}
.pick input:checked+span{background:var(--g);color:#fff}.pick input:focus-visible+span{outline:3px solid #e0a020}.wide{margin-top:16px}
.hi,.total{font-size:20px}.wk{display:flex;justify-content:space-between;font-size:18px}
.have{padding-left:20px}.have li{font-size:20px;margin:8px 0}
.btn{font:inherit;font-size:16px;padding:8px 14px;border:1px solid var(--g);border-radius:8px;background:#fff;color:var(--g);cursor:pointer}
.btn.fill{background:var(--g);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:12px;padding:12px 14px}.tile b{display:block;font-size:24px}.tile span{color:var(--mute);font-size:15px}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}th{font-size:14px;color:var(--mute);font-weight:600}
td.n,th.n{text-align:right;white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}.tabs a{padding:8px 14px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--ink)}.tabs a.on{background:var(--g);color:#fff;border-color:var(--g)}
.status{font-size:14px;padding:2px 8px;border-radius:999px;background:#eee}.status.paid{background:var(--gl);color:var(--g)}.status.sent{background:#e6eef8;color:#2a4d7a}
form.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end}
form.row label{font-size:14px;color:var(--mute)}form.row input{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px}
.note{color:var(--mute);font-size:15px}
.inv{border:1px solid var(--line);border-radius:12px;padding:24px;margin-top:12px;background:#fff}
.inv h3{margin:0;font-size:26px}.inv .sub{color:var(--mute);font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.scroll{overflow-x:auto}
@media screen and (min-width:900px){
main{max-width:1120px;padding:16px 32px 60px}
.who{grid-template-columns:1fr 1fr;width:100%;max-width:720px;margin:12px auto 0}body:has(.who) main{text-align:center;min-height:72vh;display:flex;flex-direction:column;justify-content:center}body:has(.who) .who button{text-align:left}
.days{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
@media (min-width:1000px){.days{grid-template-columns:repeat(7,1fr)}}
.day,.day.future{flex-direction:column;align-items:stretch;justify-content:space-between;min-height:180px;padding:16px 14px;font-size:20px}
.day .l{min-width:0}.day .jobs{white-space:normal;overflow-wrap:anywhere}.day>span:last-child{margin-top:10px;font-size:18px}
.grid{grid-template-columns:repeat(3,1fr)}.grid.hrs{grid-template-columns:repeat(10,1fr)}
.stick{position:static;padding:8px 0 12px;box-shadow:none;border-top:1px solid var(--line);margin-top:16px}.stick .big{margin:4px 0 0}
body.entry main{padding-bottom:60px}
main.rail{display:grid;grid-template-columns:190px minmax(0,1fr);column-gap:36px;align-items:start}
main.rail .top{grid-column:1/-1}
main.rail .tabs{grid-column:1;grid-row:2/span 99;flex-direction:column;gap:4px;position:sticky;top:16px;margin-top:4px;max-height:calc(100vh - 32px);overflow:auto}
main.rail .tabs a:not(.on):hover{background:var(--gl)}main.rail .tabs a:focus-visible{outline:3px solid #e0a020}
main.rail .tabs a{padding:12px 16px;border-radius:10px;border-color:transparent;font-size:18px}main.rail .tabs a.on{border-color:var(--g)}
main.rail>:not(.top):not(.tabs){grid-column:2}main.rail h2:first-of-type{margin-top:8px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.tile{padding:14px 16px;display:flex;flex-direction:column;min-height:104px}.tile span{font-size:14px;line-height:1.4}.tile b{margin-top:auto}
.inv{width:680px;max-width:100%;min-height:880px;padding:56px 64px 48px;margin:18px 0 0;box-shadow:0 2px 14px rgba(0,0,0,.08)}.inv h2{font-size:26px}main.rail .big{margin-bottom:24px;padding:16px;font-size:21px}
.acts{margin:12px 0 0;flex-wrap:nowrap}.acts .btn{padding:8px 12px;white-space:nowrap}.acts .status{align-self:center;font-size:16px}
}
@media print{.demo,.top,.tabs,.acts,.noprint{display:none!important}.inv{border:0;padding:0;width:auto;max-width:none;min-height:0;margin:0}main,main.rail{display:block;padding:0;max-width:none}}
</style>
</head>
<body>
<div class="demo">Demo with sample clients and numbers. Changes stay on this device only. <button type="button" id="reset">Start over</button></div>
<main id="app"></main>
<script>
// CORE START — billing rules. Money in cents, time in minutes.
const hourlyCents = (mins, rate) => Math.floor((mins * rate + 30) / 60);   // half-up to the cent
function invoiceLines(client, cards) {
  // The flat price covers regular visits; hourly is only for extra work.
  const reg = cards.filter(c => !c.extra).reduce((a, c) => a + c.mins, 0);
  const ext = cards.filter(c => c.extra).reduce((a, c) => a + c.mins, 0);
  const flat = client.flat, rate = client.rate, out = [];
  const line = (descr, m, cents) => { if (m) out.push({ descr, mins: m, cents }); };
  if (flat) out.push({ descr: "Monthly service", mins: 0, cents: flat });
  if (rate && !flat) line("Labor (hourly)", reg + ext, hourlyCents(reg + ext, rate));
  else if (rate) { line("Regular visits (included in monthly service)", reg, 0); line("Extra work (hourly)", ext, hourlyCents(ext, rate)); }
  else line("Labor (included in monthly service)", reg + ext, 0);
  return out;
}
const total = lines => lines.reduce((a, l) => a + l.cents, 0);
function canAddHours(cards, user, day, mins, today) {
  if (day > today) return "That day hasn't happened yet.";
  if (!(mins > 0 && mins <= 960)) return "Hours must be between 0 and 16.";
  const have = cards.filter(c => c.user === user && c.day === day).reduce((a, c) => a + c.mins, 0);
  if (have + mins > 960) return "That's more than 16 hours on one day.";
  return "";
}
// CORE END
if (typeof module !== "undefined") { module.exports = { hourlyCents, invoiceLines, total, canAddHours }; }
else (function () {   // a function scope, not a bare block: WebKit hoists block functions above the block's const (blank page in Safari, 10-08)
const KEY = "hg_office_demo_v1", CREW = ["Shawn", "Paris", "Steve"];
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromIso = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = fromIso(s); d.setDate(d.getDate() + n); return iso(d); };
const TODAY = iso(new Date()), MONTH = TODAY.slice(0, 7);
const money = c => "$" + (c / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const hrs = m => { const h = Math.floor(m / 60), r = m % 60; if (r && r !== 30) return `${h}h ${pad(r)}m`; const n = (h ? h : "") + (r ? "½" : ""); return m <= 60 ? n + " hr" : n + " hrs"; };
const E = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const monthName = m => fromIso(m + "-01").toLocaleString("en-US", { month: "long", year: "numeric" });

function seed() {
  const clients = [
    { id: 1, name: "Sample client A", property: "Sample property, Waimea", flat: 30000, rate: 0 },
    { id: 2, name: "Sample client B", property: "Sample property, Kailua-Kona", flat: 0, rate: 6000 },
    { id: 3, name: "Sample client C", property: "Sample property, Waikoloa", flat: 25000, rate: 5000 },
  ];
  const cards = []; let id = 1;
  // sample hours on past weekdays of this month only
  for (let d = MONTH + "-01"; d < TODAY && d.startsWith(MONTH); d = addDays(d, 1)) {
    const wd = fromIso(d).getDay(); if (wd === 0 || wd === 6) continue;
    const n = Number(d.slice(8));
    cards.push({ id: id++, user: "Shawn", client: 1 + (n % 3), day: d, mins: 240 + (n % 3) * 60, extra: false });
    cards.push({ id: id++, user: "Paris", client: 1 + ((n + 1) % 3), day: d, mins: 360, extra: false });
    if (wd === 1 || wd === 3) cards.push({ id: id++, user: "Steve", client: 3, day: d, mins: 180, extra: false });
    if (wd === 2) cards.push({ id: id++, user: "Steve", client: 3, day: d, mins: 120, extra: true });
  }
  return { clients, cards, invoices: {}, expenses: [{ id: 1, day: MONTH + "-02", cents: 8450, what: "Sample: fuel" }], next: id };
}
const validDay = d => /^\d{4}-\d{2}-\d{2}$/.test(d || "") && iso(fromIso(d)) === d;
let S; try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
if (!S || !Array.isArray(S.cards) || !Array.isArray(S.clients) || !S.invoices || !Array.isArray(S.expenses)) S = seed();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
let who = null; try { who = sessionStorage.getItem("hg_who"); } catch (e) {}
const setWho = w => { who = w; try { w ? sessionStorage.setItem("hg_who", w) : sessionStorage.removeItem("hg_who"); } catch (e) {} };
const app = document.getElementById("app");
const go = h => { location.hash = h; };
const clientOf = id => S.clients.find(c => c.id === id);
const monthCards = (cid, m) => S.cards.filter(c => c.client === cid && c.day.startsWith(m));
function invoice(cid, m) {
  const k = cid + "|" + m, inv = S.invoices[k];
  return inv || null;
}
function prepare(m) {
  for (const c of S.clients) {
    const k = c.id + "|" + m, inv = S.invoices[k];
    if (inv && inv.status !== "draft") continue;   // sent/paid invoices are never rebuilt
    const lines = invoiceLines(c, monthCards(c.id, m));
    S.invoices[k] = { client: c.id, month: m, status: "draft", lines, issued: TODAY, no: (inv && inv.no) || Math.max(0, ...Object.values(S.invoices).map(i => i.no)) + 1 };
  }
  save();
}

function top(title) {
  return `<div class="top"><h1>${E(title)}</h1><span>${E(who)} · <a href="#" data-out>Switch person</a></span></div>`;
}

function login() {
  app.innerHTML = `<h1>Humble Gardens</h1><p class="hi">Who are you?</p><div class="who">
    <button data-who="Clark">Clark <small>owner</small></button>
    ${CREW.map(n => `<button data-who="${n}">${n} <small>crew</small></button>`).join("")}</div>
    <p class="note">The real one has a password for each person.</p>`;
}

function crewWeek(q) {
  let w = validDay(q.w) ? q.w : TODAY; if (w > TODAY) w = TODAY;
  const dow = (fromIso(w).getDay() + 6) % 7, mon = addDays(w, -dow);
  const days = [...Array(7)].map((_, i) => addDays(mon, i));
  const got = {}, jobs = {};
  for (const c of S.cards) if (c.user === who && c.day >= days[0] && c.day <= days[6]) { got[c.day] = (got[c.day] || 0) + c.mins; (jobs[c.day] = jobs[c.day] || []).push(clientOf(c.client).name); }
  const tiles = days.map(d => {
    const dt = fromIso(d), lab = `<em style="font-style:normal">${dt.toLocaleString("en-US", { weekday: "short" })} <small>${dt.toLocaleString("en-US", { month: "short" })} ${dt.getDate()}</small></em>`;
    const m = got[d] || 0;
    if (d > TODAY) return `<div class="day future">${lab}<span><i>later</i></span></div>`;
    const j = jobs[d] ? `<small class="jobs">${[...new Set(jobs[d])].map(E).join(", ")}</small>` : "";
    return `<a class="day${m ? " done" : ""}${d === TODAY ? " today" : ""}" href="#day/${d}"><span class="l">${lab}${j}</span><span>${m ? `<b>${hrs(m)}</b>` : "<i>add hours</i>"}</span></a>`;
  }).join("");
  const next = addDays(mon, 7);
  const sum = Object.values(got).reduce((a, b) => a + b, 0);
  const saved = q.saved && /^[\d½]+ hrs? at .+ on [A-Z][a-z]+day$/.test(q.saved) ? `<p class="saved">Saved: ${E(q.saved)}</p>` : "";
  app.innerHTML = top("My hours") + saved + `<p class="hi">Aloha ${E(who)}. Pick a day, then the job and the hours.</p>
    <p class="wk"><a href="#week/${addDays(mon, -7)}">&larr; Last week</a>${next <= TODAY ? `<a href="#week/${next}">Next week &rarr;</a>` : ""}</p>
    <div class="days">${tiles}</div><p class="total">This week: <b>${hrs(sum)}</b></p>`;
}

function crewDay(d, err) {
  if (!validDay(d) || d > TODAY) return go("");
  document.body.classList.add("entry");
  const dt = fromIso(d);
  const have = S.cards.filter(c => c.user === who && c.day === d).map(c =>
    `<li>${E(clientOf(c.client).name)}${c.extra ? " (extra work)" : ""}: <b>${hrs(c.mins)}</b> <button class="btn" data-del="${c.id}">Remove</button></li>`).join("");
  const jobs = S.clients.map(c => `<label class="pick"><input type="radio" name="client" value="${c.id}"><span>${E(c.name)}</span></label>`).join("");
  const tiles = [...Array(20)].map((_, i) => `<label class="pick"><input type="radio" name="mins" value="${(i + 1) * 30}"><span>${hrs((i + 1) * 30)}</span></label>`).join("");
  app.innerHTML = top("My hours") + `<p><a href="#week/${d}">&larr; Back to the week</a></p>
    <h2 style="font-size:28px">${dt.toLocaleString("en-US", { weekday: "long" })}, ${dt.toLocaleString("en-US", { month: "long" })} ${dt.getDate()}</h2>
    ${err ? `<p style="color:#a33;font-size:20px">${E(err)}</p>` : ""}
    ${have ? `<h2>Already in</h2><ul class="have">${have}</ul>` : ""}
    <form id="hours"><h2>1. Which job?</h2><div class="grid">${jobs}</div>
    <h2>2. How many hours?</h2><div class="grid hrs">${tiles}</div>
    <label class="pick wide"><input type="checkbox" name="extra"><span>This was extra work, on top of the usual visit</span></label>
    <div class="stick"><p id="msg" class="err"></p><button class="big" id="savebtn">Save</button></div></form>`;
  const form = document.getElementById("hours"), btn = document.getElementById("savebtn"), msg = document.getElementById("msg");
  form.oninput = () => { const f = new FormData(form), c = f.get("client"), m = f.get("mins"); msg.textContent = "";
    btn.innerHTML = c && m ? `Save ${hrs(Number(m))}<small>${E(clientOf(Number(c)).name)}</small>` : c ? "Now pick the hours" : m ? "Now pick the job" : "Save"; };
  form.onsubmit = e => {
    e.preventDefault(); const f = new FormData(form), mins = Number(f.get("mins")), cid = Number(f.get("client"));
    if (!cid) { msg.textContent = "Pick a job first."; return; } if (!mins) { msg.textContent = "Pick the hours."; return; }
    const bad = canAddHours(S.cards, who, d, mins, TODAY); if (bad) { msg.textContent = bad; return; }
    S.cards.push({ id: S.next++, user: who, client: cid, day: d, mins, extra: f.get("extra") === "on" }); save();
    location.hash = `week/${d}?saved=${encodeURIComponent(hrs(mins) + " at " + clientOf(cid).name + " on " + fromIso(d).toLocaleString("en-US", { weekday: "long" }))}`;
  };
}

function ownerTabs(on, m) {
  const t = [["Dashboard", ""], ["Invoices", "invoices"], ["Hours", "hours"], ["Clients", "clients"], ["Expenses", "expenses"]];
  return `<div class="tabs">${t.map(([l, h]) => `<a href="#${h}${h ? "/" : ""}${h ? m : "m/" + m}" class="${on === l ? "on" : ""}">${l}</a>`).join("")}</div>`;
}
function monthNav(base, m) {
  const d = fromIso(m + "-01"), p = new Date(d.getFullYear(), d.getMonth() - 1, 1), n = new Date(d.getFullYear(), d.getMonth() + 1, 1);
  const pm = iso(p).slice(0, 7), nm = iso(n).slice(0, 7);
  return `<p class="wk"><a href="#${base}${pm}">&larr; ${monthName(pm)}</a><b>${monthName(m)}</b>${nm <= MONTH ? `<a href="#${base}${nm}">${monthName(nm)} &rarr;</a>` : "<span></span>"}</p>`;
}
function invsFor(m) { return Object.values(S.invoices).filter(i => i.month === m); }

function ownerDash(m) {
  const inv = invsFor(m), sum = s => inv.filter(i => !s || i.status === s).reduce((a, i) => a + total(i.lines), 0);
  const exp = S.expenses.filter(x => x.day.startsWith(m)).reduce((a, x) => a + x.cents, 0);
  const mins = S.cards.filter(c => c.day.startsWith(m)).reduce((a, c) => a + c.mins, 0);
  const per = S.clients.map(c => { const cs = monthCards(c.id, m), i = invoice(c.id, m);
    return `<tr><td>${E(c.name)}</td><td class="n">${(t => t ? hrs(t) : "0")(cs.reduce((a, x) => a + x.mins, 0))}</td><td class="n">${(ex => ex ? hrs(ex) : "—")(cs.filter(x => x.extra).reduce((a, x) => a + x.mins, 0))}</td><td class="n">${i ? money(total(i.lines)) + ` <span class="status ${i.status}">${i.status}</span>` : "—"}</td></tr>`; }).join("");
  app.innerHTML = top("Office") + ownerTabs("Dashboard", m) + monthNav("m/", m) + `
    <div class="tiles"><div class="tile"><span>Invoiced</span><b>${money(sum())}</b></div><div class="tile"><span>Paid</span><b>${money(sum("paid"))}</b></div>
    <div class="tile"><span>Owed (sent, unpaid)</span><b>${money(sum("sent"))}</b></div><div class="tile"><span>Expenses (sample)</span><b>${money(exp)}</b></div>
    <div class="tile"><span>Crew hours (sample)</span><b>${mins ? hrs(mins) : "0"}</b></div></div>
    ${inv.length ? `<p class="note">${inv.filter(i => i.status === "draft").length} draft${inv.filter(i => i.status === "draft").length === 1 ? "" : "s"} (${money(sum("draft"))}) not sent yet. Invoiced counts drafts too.</p>` : `<p class="note">No invoices for ${monthName(m)} yet.</p><a class="big" href="#invoices/${m}">Prepare invoices for ${monthName(m)}</a>`}
    <h2>By client</h2><div class="scroll"><table><tr><th>Client</th><th class="n">Hours</th><th class="n">Extra</th><th class="n">Invoice</th></tr>${per}</table></div>`;
}

function ownerInvoices(m) {
  const rows = S.clients.map(c => { const i = invoice(c.id, m); if (!i) return "";
    const basis = [c.flat ? `flat ${money(c.flat)}` : "", ...i.lines.filter(l => l.cents && l.mins).map(l => `${hrs(l.mins)} × ${money(c.rate)}/h`)].filter(Boolean).join(" + ") || "no charge";
    return `<tr><td><a href="#invoice/${c.id}/${m}">${E(c.name)}</a><br><span class="note">${basis}</span></td><td class="n">${money(total(i.lines))}</td><td><span class="status ${i.status}">${i.status}${i.paid_method ? " · " + i.paid_method : ""}</span></td></tr>`; }).join("");
  app.innerHTML = top("Office") + ownerTabs("Invoices", m) + monthNav("invoices/", m) + `
    <button class="${rows ? "btn fill" : "big"}" data-prep="${m}" style="margin-top:6px">${rows ? "Prepare again (updates drafts)" : `Prepare invoices for ${monthName(m)}`}</button>
    <p class="note">Builds a draft for every client from the crew's hours. Drafts update each time you press it; sent and paid invoices stay as they are.</p>
    ${rows ? `<div class="scroll"><table><tr><th>Client</th><th class="n">Total</th><th>Status</th></tr>${rows}</table></div>` : ""}`;
}

function ownerInvoice(cid, m) {
  const c = clientOf(cid), i = invoice(cid, m); if (!i) return go("invoices/" + m);
  const lines = i.lines.filter(l => l.cents).map(l => `<tr><td>${E(l.descr)}</td>${i.lines.some(x => x.cents && x.mins) ? `<td class="n">${l.mins ? hrs(l.mins) : ""}</td>` : ""}<td class="n">${money(l.cents)}</td></tr>`).join("");
  const hasHrs = i.lines.some(l => l.cents && l.mins);
  const incl = i.lines.filter(l => !l.cents && l.mins).map(l => `${hrs(l.mins)} of regular visits included in the monthly service`).join("; ");
  const acts = `<div class="acts noprint"><span class="status ${i.status}">${i.status}${i.paid_method ? " · " + i.paid_method : ""}</span><button class="btn fill" onclick="print()">Print / save as PDF</button>
    ${i.status === "draft" ? `<button class="btn" data-sent="${cid}|${m}">Mark as sent</button>` : ""}
    ${i.status !== "paid" ? ["cash", "check", "bank"].map(x => `<button class="btn" data-pay="${cid}|${m}|${x}">Paid by ${x}</button>`).join("") : ""}</div>`;
  app.innerHTML = top("Office") + ownerTabs("Invoices", m) + `<p class="noprint"><a href="#invoices/${m}">&larr; All invoices</a></p>` + acts + `
    <div class="inv"><div class="sample">SAMPLE</div><h3>Humble Gardens</h3><div class="sub">Big Island, Hawaii · 808-987-0674</div>
    <h2 style="margin-top:20px">Invoice ${m}-${String(i.no).padStart(4, "0")}</h2><p>Billed to: <b>${E(c.name)}</b><br>${E(c.property)}</p>
    <p class="sub">Date: ${fromIso(i.issued || TODAY).toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" })} · Due: ${fromIso(addDays(i.issued || TODAY, 14)).toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" })}</p>
    <table><tr><th>Description</th>${hasHrs ? '<th class="n">Hours</th>' : ""}<th class="n">Amount</th></tr>${lines}
    <tr><td><b>Total</b></td>${hasHrs ? "<td></td>" : ""}<td class="n"><b>${money(total(i.lines))}</b></td></tr></table>
    ${incl ? `<p class="sub">${incl}.</p>` : ""}<p>Pay by cash, check, or bank transfer. Mahalo!</p>
    ${i.status === "paid" ? `<p>Paid by ${E(i.paid_method)} on ${E(i.paid_on)}. Mahalo.</p>` : ""}</div>
    <p class="note noprint">You send it yourself: in the real one this invoice becomes a PDF attached to an email.</p>`;
}

function ownerHours(m) {
  const people = CREW.map(p => { const cs = S.cards.filter(c => c.user === p && c.day.startsWith(m));
    return `<tr><td>${p}</td><td class="n">${hrs(cs.reduce((a, c) => a + c.mins, 0)) || "0"}</td><td class="n">${cs.length}</td></tr>`; }).join("");
  const recent = S.cards.filter(c => c.day.startsWith(m)).sort((a, b) => b.day.localeCompare(a.day) || b.id - a.id).slice(0, 30).map(c =>
    `<tr><td>${c.day.slice(5)}</td><td>${c.user}</td><td>${E(clientOf(c.client).name)}${c.extra ? " (extra)" : ""}</td><td class="n">${hrs(c.mins)}</td></tr>`).join("");
  app.innerHTML = top("Office") + ownerTabs("Hours", m) + monthNav("hours/", m) + `
    <h2>By person</h2><table><tr><th>Crew</th><th class="n">Hours</th><th class="n">Entries</th></tr>${people}</table>
    <h2>Latest entries</h2><div class="scroll"><table><tr><th>Day</th><th>Who</th><th>Job</th><th class="n">Hours</th></tr>${recent || `<tr><td colspan="4">No hours entered for ${monthName(m)}.</td></tr>`}</table></div>`;
}

function ownerClients(m) {
  const rows = S.clients.map(c => `<tr><td>${E(c.name)}<br><span class="note">${E(c.property)}</span></td><td class="n">${c.flat ? money(c.flat) + "/mo" : "—"}</td><td class="n">${c.rate ? money(c.rate) + "/h" : "—"}</td></tr>`).join("");
  app.innerHTML = top("Office") + ownerTabs("Clients", m) + `
    <div class="scroll"><table><tr><th>Client</th><th class="n">Flat</th><th class="n">Hourly</th></tr>${rows}</table></div>
    <h2>Add a client</h2><form class="row" id="cl"><label>Name<input name="name" required></label><label>Property<input name="property"></label>
    <label>Flat $ per month<input name="flat" inputmode="decimal" value="0"></label><label>Hourly $ (extra work)<input name="rate" inputmode="decimal" value="0"></label>
    <button class="btn fill">Add</button></form>`;
  document.getElementById("cl").onsubmit = e => { e.preventDefault(); const f = new FormData(e.target);
    if (![f.get("flat") || 0, f.get("rate") || 0].every(v => isFinite(Number(v)) && Number(v) >= 0)) return alert("Please enter the prices as numbers, like 250 or 45.50.");
    S.clients.push({ id: Math.max(...S.clients.map(c => c.id)) + 1, name: f.get("name"), property: f.get("property"), flat: Math.round(Number(f.get("flat") || 0) * 100), rate: Math.round(Number(f.get("rate") || 0) * 100) }); save(); safe(); };
}

function ownerExpenses(m) {
  const rows = S.expenses.filter(x => x.day.startsWith(m)).map(x => `<tr><td>${x.day.slice(5)}</td><td>${E(x.what)}</td><td class="n">${money(x.cents)}</td></tr>`).join("");
  app.innerHTML = top("Office") + ownerTabs("Expenses", m) + monthNav("expenses/", m) + `
    <div class="scroll"><table><tr><th>Day</th><th>What for</th><th class="n">Amount</th></tr>${rows || `<tr><td colspan="3">No expenses for ${monthName(m)}.</td></tr>`}</table></div>
    <h2>Add an expense</h2><form class="row" id="ex"><label>Day<input name="day" type="date" value="${TODAY}" required></label><label>What for<input name="what" required></label>
    <label>Amount $<input name="amt" inputmode="decimal" required></label><button class="btn fill">Add</button></form>`;
  document.getElementById("ex").onsubmit = e => { e.preventDefault(); const f = new FormData(e.target);
    if (!isFinite(Number(f.get("amt"))) || Number(f.get("amt")) <= 0) return alert("Please enter the amount as a number, like 84.50.");
    S.expenses.push({ id: Math.max(0, ...S.expenses.map(x => x.id)) + 1, day: f.get("day"), what: f.get("what"), cents: Math.round(Number(f.get("amt")) * 100) }); save(); safe(); };
}

function render() {
  document.body.classList.remove("entry"); scrollTo(0, 0);
  if (!who) return login();
  const [path, qs] = (location.hash.slice(1) || "").split("?"), [r, a, b] = path.split("/"), q = Object.fromEntries(new URLSearchParams(qs || ""));
  if (who !== "Clark") return r === "day" ? crewDay(a) : crewWeek({ w: r === "week" ? a : "", saved: q.saved });
  const m = /^\d{4}-(0[1-9]|1[0-2])$/.test(a || "") && a <= MONTH ? a : MONTH;
  if (r === "invoices") return ownerInvoices(m);
  if (r === "invoice") return ownerInvoice(Number(a), b);
  if (r === "hours") return ownerHours(m);
  if (r === "clients") return ownerClients(m);
  if (r === "expenses") return ownerExpenses(m);
  return ownerDash(m);
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-who],[data-out],[data-del],[data-prep],[data-sent],[data-pay]"); if (!t) return;
  e.preventDefault(); const d = t.dataset;
  if (d.who) { setWho(d.who); location.hash = ""; }
  else if ("out" in d) { setWho(null); location.hash = ""; }
  else if (d.del) { if (!confirm("Remove this entry?")) return; S.cards = S.cards.filter(c => !(c.id === Number(d.del) && c.user === who)); save(); }
  else if (d.prep) prepare(d.prep);
  else if (d.sent) { const i = S.invoices[d.sent]; if (i.status === "draft") i.status = "sent"; save(); }
  else if (d.pay) { const [c, m, x] = d.pay.split("|"), i = S.invoices[c + "|" + m]; i.status = "paid"; i.paid_method = x; i.paid_on = TODAY; save(); }
  safe();
});
document.getElementById("reset").onclick = () => { if (confirm("Start the demo over with the sample data?")) { S = seed(); save(); setWho(null); location.hash = ""; safe(); } };
const safe = () => { try { render(); app.classList.toggle("rail", !!app.querySelector(".tabs")); } catch (e) { app.innerHTML = '<h1>Something went wrong</h1><p class="hi">Tap "Start over" at the top.</p>'; } };
window.addEventListener("hashchange", safe);
safe();
})();
</script>
</body>
</html>
